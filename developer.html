<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAMPUS//ARCHIVE V5 · Developer Console</title><style>:root{--a:#c9ff3d}*{box-sizing:border-box}body{margin:0;background:#0f1114;color:#eee;font-family:Inter,"PingFang SC",system-ui}.wrap{max-width:980px;margin:auto;padding:30px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font:900 18px monospace}.brand b{color:var(--a)}a{color:#cfd4d7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.card{background:#171a1e;border:1px solid #2b3035;border-radius:22px;padding:20px}.card h2{margin:0 0 14px;font-size:20px}.card p{color:#969da3;line-height:1.7;font-size:13px}.field{display:grid;gap:7px;margin-top:12px}.field label{font:800 10px monospace;color:#899198}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #353b41;background:#101215;color:#fff;border-radius:12px}.btn{border:0;background:var(--a);color:#111;padding:12px 15px;border-radius:999px;font-weight:900;cursor:pointer;margin-top:13px}.btn.dark{background:#2b3035;color:#fff}.code{margin-top:14px;padding:14px;border-radius:14px;background:#0e1013;border:1px dashed #3a4148;font:800 12px/1.7 monospace;word-break:break-all;color:var(--a)}.status{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #272c31}.row span{color:#899096}.warn{margin-top:20px;padding:15px;border-left:4px solid #ffba65;background:#1b1915;color:#d9d0c4;line-height:1.7;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">CAMPUS<b>//</b>ARCHIVE · DEV</div><a href="index.html">返回测试</a></div><div class="grid"><div class="card"><h2>授权码生成器</h2><p>生成 V5 前端原型可识别的访问码。正式收费版不要沿用前端密钥方案。</p><div class="field"><label>授权类型</label><select id="tier"><option value="T1">1 次</option><option value="T3">3 次</option><option value="T10">10 次</option><option value="VIP">不限次数</option></select></div><div class="field"><label>有效期</label><select id="days"><option value="1">1 天</option><option value="7">7 天</option><option value="30" selected>30 天</option><option value="365">365 天</option><option value="LIFE">长期</option></select></div><div class="field"><label>批次标识</label><input id="batch" value="A001"></div><button class="btn" onclick="generate()">生成授权码</button><div id="code" class="code">等待生成…</div><button class="btn dark" onclick="copyCode()">复制授权码</button></div><div class="card"><h2>本设备状态</h2><div class="status"><div class="row"><span>设备 ID</span><b id="device">—</b></div><div class="row"><span>免费次数已用</span><b id="free">—</b></div><div class="row"><span>授权状态</span><b id="license">—</b></div><div class="row"><span>开发者模式</span><b id="dev">—</b></div></div><button class="btn" onclick="toggleDev()">切换开发者不限次数</button><button class="btn dark" onclick="resetDevice()">重置本设备测试状态</button></div></div><div class="warn"><b>重要：</b>V5 的授权码系统是为了让你先把商业化流程、页面、次数逻辑和开发者入口跑通。因为验证逻辑存在于浏览器前端，懂代码的人可以绕过。正式收款上线时，应把授权码生成/验证、订单、次数扣减、设备绑定和风控放到后端或云函数。</div></div><script>const C={secret:'CA5-COMMERCIAL-2026-09',keyFree:'ca5_free_used',keyLicense:'ca5_license_state',keyDevice:'ca5_device_id',keyDev:'ca5_dev_mode'};function h(s){let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return(x>>>0).toString(36).toUpperCase().padStart(7,'0')}function id(){let x=localStorage.getItem(C.keyDevice);if(!x){x='D-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,7).toUpperCase();localStorage.setItem(C.keyDevice,x)}return x}function date(days){if(days==='LIFE')return'LIFE';const d=new Date();d.setDate(d.getDate()+Number(days));return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}function generate(){const tier=document.getElementById('tier').value,ex=date(document.getElementById('days').value),nonce=Math.random().toString(36).slice(2,7).toUpperCase(),batch=(document.getElementById('batch').value||'A001').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8),payload=[tier,ex,nonce,batch].join('-'),sig=h(payload+'|'+C.secret);document.getElementById('code').textContent='CA5-'+payload+'-'+sig}function copyCode(){navigator.clipboard?.writeText(document.getElementById('code').textContent)}function refresh(){document.getElementById('device').textContent=id();document.getElementById('free').textContent=localStorage.getItem(C.keyFree)||'0';let l;try{l=JSON.parse(localStorage.getItem(C.keyLicense)||'null')}catch(e){}document.getElementById('license').textContent=l?(l.tier+' / '+(l.credits===999?'不限':l.credits)+' 次'):'未激活';document.getElementById('dev').textContent=localStorage.getItem(C.keyDev)==='1'?'已开启':'关闭'}function toggleDev(){localStorage.setItem(C.keyDev,localStorage.getItem(C.keyDev)==='1'?'0':'1');refresh()}function resetDevice(){localStorage.removeItem(C.keyFree);localStorage.removeItem(C.keyLicense);localStorage.removeItem('campus_archive_progress_v4');localStorage.removeItem('campus_archive_last_v4');refresh()}refresh();</script></body></html>
